name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : prisma generate lit DATABASE_URL sans s'y connecter, et
      # lib/stripe.ts et lib/cloudinary.ts lèvent une erreur au chargement si
      # leurs variables manquent. Le build ne contacte aucun de ces services.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      STRIPE_SECRET: sk_test_ci
      CLOUDINARY_CLOUD_NAME: ci
      CLOUDINARY_API_KEY: ci
      CLOUDINARY_API_SECRET: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
